---
name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      confirm:
        description: "Type 'release' to confirm cutting a release from current main"
        required: false
        default: ""

permissions: read-all

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  propose:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      release_created: ${{ steps.decide.outputs.release_created }}
      version:         ${{ steps.decide.outputs.version }}
      tag_name:        ${{ steps.decide.outputs.tag_name }}
      changelog_body:  ${{ steps.notes.outputs.body }}
    steps:
      - name: Checkout with full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main

      - name: Setup Go (for `go install svu`)
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          check-latest: false

      - name: Install svu
        run: go install github.com/caarlos0/svu/v3@latest

      - name: Decide whether to release
        id: decide
        shell: bash
        run: |
          set -euo pipefail
          NEXT=$(svu next)
          CURRENT=$(svu current 2>/dev/null || echo "v0.0.0")
          echo "svu current=${CURRENT} next=${NEXT}"
          if [ "$NEXT" = "$CURRENT" ]; then
            echo "No release-worthy commits since ${CURRENT}; nothing to release."
            echo "release_created=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] \
             && [ "${{ inputs.confirm }}" != "release" ]; then
            echo "::notice::Dry-run: would release ${NEXT}. Re-dispatch with confirm=release to cut it."
            echo "release_created=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "release_created=true" >> "$GITHUB_OUTPUT"
          echo "version=${NEXT#v}"    >> "$GITHUB_OUTPUT"
          echo "tag_name=${NEXT}"     >> "$GITHUB_OUTPUT"

      - name: Generate release notes with git-cliff
        if: steps.decide.outputs.release_created == 'true'
        id: cliff_action
        uses: orhun/git-cliff-action@v4
        with:
          config: cliff.toml
          args: --unreleased --strip all --tag ${{ steps.decide.outputs.tag_name }}

      - name: Expose changelog body as output
        if: steps.decide.outputs.release_created == 'true'
        id: notes
        shell: bash
        run: |
          {
            echo "body<<CHANGELOG_EOF"
            cat "$CHANGELOG_PATH"
            echo "CHANGELOG_EOF"
          } >> "$GITHUB_OUTPUT"
        env:
          CHANGELOG_PATH: ${{ steps.cliff_action.outputs.changelog }}

  goreleaser:
    needs: propose
    if: needs.propose.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write   # push tag, create draft release, upload assets
      id-token: write   # cosign keyless via OIDC
    outputs:
      hashes: ${{ steps.hashes.outputs.hashes }}
      tag_name: ${{ needs.propose.outputs.tag_name }}
    steps:
      - name: Preflight — tag must not already exist; delete stale draft release if present
        shell: bash
        run: |
          set -euo pipefail
          if gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${TAG}" >/dev/null 2>&1; then
            echo "::error::Tag ${TAG} already exists. Refusing to proceed." >&2
            exit 1
          fi
          if gh release view "$TAG" --json isDraft --jq '.isDraft' 2>/dev/null | grep -qx true; then
            echo "::warning::Stale draft release for ${TAG} exists — deleting so GoReleaser starts clean."
            gh release delete "$TAG" --yes
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.propose.outputs.tag_name }}

      - name: Checkout at main (with full history for GoReleaser changelog)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main
          token: ${{ secrets.GITHUB_TOKEN }}   # workflow's built-in token; identity github-actions[bot] is on the tag-ruleset bypass list

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          check-latest: false

      - name: Install cosign
        uses: sigstore/cosign-installer@v3

      - name: Install syft
        uses: anchore/sbom-action/download-syft@v0

      - name: Write release notes to a file
        shell: bash
        run: |
          printf '%s' "$CHANGELOG_BODY" > "$RUNNER_TEMP/release-notes.md"
        env:
          CHANGELOG_BODY: ${{ needs.propose.outputs.changelog_body }}

      - name: Create and push the release tag
        shell: bash
        run: |
          set -euo pipefail
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$TAG" -m "Release $TAG"
          git push origin "$TAG"
        env:
          TAG: ${{ needs.propose.outputs.tag_name }}

      - name: GoReleaser (build, sign, SBOM, create draft release)
        uses: goreleaser/goreleaser-action@v7
        with:
          version: "~> v2"
          args: release --clean --release-notes=${{ runner.temp }}/release-notes.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GORELEASER_CURRENT_TAG: ${{ needs.propose.outputs.tag_name }}

      - name: Emit hashes for SLSA consumer
        id: hashes
        shell: bash
        run: |
          echo "hashes=$(base64 -w0 < dist/checksums.txt)" >> "$GITHUB_OUTPUT"

  slsa:
    needs: goreleaser
    permissions:
      id-token: write
      contents: write
      actions: read
    uses: slsa-framework/slsa-github-generator/.github/workflows/generator_generic_slsa3.yml@v2.0.0
    with:
      base64-subjects: "${{ needs.goreleaser.outputs.hashes }}"
      upload-assets: true
      upload-tag-name: ${{ needs.goreleaser.outputs.tag_name }}
      draft-release: true

  promote:
    needs: [goreleaser, slsa]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write   # for the failure-issue-creation step below
    steps:
      - name: Publish the draft release (last write; immutable-releases-safe)
        shell: bash
        run: |
          set -euo pipefail
          gh release edit "$TAG" --draft=false --repo "$REPO"
          gh release view "$TAG" --repo "$REPO" \
            --json name,tagName,isDraft,isPrerelease,url --jq '.'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          TAG: ${{ needs.goreleaser.outputs.tag_name }}

      - name: Job summary
        shell: bash
        run: |
          cat <<'SUMMARY' >> "$GITHUB_STEP_SUMMARY"
          ## Release published

          - Tag: `${{ needs.goreleaser.outputs.tag_name }}`
          - Cosign identity: `https://github.com/${{ github.repository }}/.github/workflows/release.yaml@refs/heads/main`
          - Provenance: attached as `multiple.intoto.jsonl`
          - Immutable-releases setting: expected ON (verify via repo settings)

          Verify from a consumer's side with the commands in `docs/verification.md`.
          SUMMARY

      - name: Open an issue on failure of any prior job
        if: failure()
        uses: actions/github-script@v7
        env:
          TAG: ${{ needs.goreleaser.outputs.tag_name }}
        with:
          script: |
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `Release ${process.env.TAG} failed`,
              body: `Release workflow failed. Run: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}\n\nDelete any stale draft release before retrying.`,
              labels: ['release-failure']
            });
